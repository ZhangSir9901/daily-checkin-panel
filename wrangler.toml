# cf-checkin-panel
# Cloudflare Workers 原生签到面板：Web 管理后台 + D1 存储 + Cron 每日自动签到

name = "daily-checkin-panel"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 静态管理后台（public/index.html），API 由 Worker 处理
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# 每小时触发一次，Worker 内按「签到时间设置」（默认北京时间 08:00）判断是否执行
# 时间在面板网页「设置」里修改，无需重新部署
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "daily-checkin-panel"
# 由 Cloudflare 仪表盘创建的 D1 数据库（daily-checkin-panel），填入其 database_id
database_id = "23a3455d-69d7-49ec-a71f-4440dff9957c"
