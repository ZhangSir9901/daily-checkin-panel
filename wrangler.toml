# cf-checkin-panel
# Cloudflare Workers 原生签到面板：Web 管理后台 + D1 存储 + Cron 每日自动签到

name = "daily-checkin-panel"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 静态管理后台（public/index.html），API 由 Worker 处理
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# 每小时触发一次，Worker 内按「签到时间设置」（默认北京时间 08:00）判断是否执行
# 时间在面板网页「设置」里修改，无需重新部署
[[triggers.crons]]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "daily-checkin-panel"
# 部署前先执行：npx wrangler d1 create daily-checkin-panel
# 把返回的 database_id 填到下面
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
